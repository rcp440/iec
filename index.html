<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asistencia por Maestro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f0f2f5; color: #1a1a2e; }
    header { background: #2d3561; color: white; padding: 16px 24px; display: flex; align-items: center; gap: 12px; }
    header h1 { font-size: 1.25rem; font-weight: 600; }
    .container { max-width: 1300px; margin: 24px auto; padding: 0 16px; }

    /* Filters */
    .filters { background: white; padding: 16px 20px; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.08); display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 20px; }
    .filter-group { display: flex; flex-direction: column; gap: 5px; }
    label { font-size: 0.72rem; font-weight: 700; color: #666; text-transform: uppercase; letter-spacing: .06em; }
    select { padding: 8px 12px; border: 1.5px solid #ddd; border-radius: 7px; font-size: 0.95rem; background: white; min-width: 190px; cursor: pointer; }
    select:focus { outline: none; border-color: #2d3561; }
    .btn { padding: 9px 22px; border: none; border-radius: 7px; cursor: pointer; font-size: 0.9rem; font-weight: 600; transition: background .15s; }
    .btn-primary { background: #2d3561; color: white; }
    .btn-primary:hover { background: #3d4571; }
    .btn-secondary { background: #eceff1; color: #546e7a; }
    .btn-secondary:hover { background: #cfd8dc; }
    /* Stats */
    .stats { display: flex; gap: 14px; margin-bottom: 20px; flex-wrap: wrap; }
    .stat { background: white; padding: 14px 20px; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.08); min-width: 110px; }
    .stat .val { font-size: 2rem; font-weight: 800; line-height: 1; }
    .stat .lbl { font-size: 0.72rem; color: #888; margin-top: 4px; text-transform: uppercase; letter-spacing: .05em; }
    .stat.green .val { color: #2e7d32; }
    .stat.red .val { color: #c62828; }
    .stat.blue .val { color: #1565c0; }
    .stat.orange .val { color: #e65100; }

    /* Table */
    .table-wrap { overflow-x: auto; background: white; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    table { border-collapse: collapse; width: 100%; }
    thead th { background: #2d3561; color: white; padding: 10px 14px; text-align: center; font-size: 0.78rem; font-weight: 600; white-space: nowrap; }
    thead th:first-child { text-align: left; min-width: 150px; }
    tbody td { padding: 9px 14px; border-bottom: 1px solid #f0f0f0; text-align: center; font-size: 0.85rem; }
    tbody td:first-child { text-align: left; font-weight: 500; white-space: nowrap; border-right: 2px solid #e8eaf6; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:nth-child(even) td { background: #fafbff; }
    tbody tr:hover td { background: #e8eaf6 !important; }
    .p { color: #2e7d32; font-weight: 700; }
    .a { color: #c62828; font-weight: 700; }
    .dash { color: #bbb; }
    .total-row td { background: #e8eaf6 !important; font-weight: 700; border-top: 2px solid #9fa8da; font-size: 0.82rem; }
    .total-row td:first-child { background: #c5cae9 !important; }

    /* Misc */
    .loading { text-align: center; padding: 60px 20px; color: #90a4ae; font-size: 1rem; }
    .loading::before { content: ''; display: block; width: 36px; height: 36px; border: 3px solid #e0e0e0; border-top-color: #2d3561; border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { background: #ffebee; color: #c62828; padding: 14px 18px; border-radius: 8px; margin-bottom: 16px; border-left: 4px solid #c62828; font-size: 0.88rem; }
    .empty { text-align: center; padding: 60px 20px; color: #90a4ae; }
  </style>
</head>
<body>
<header>
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
  <h1>Asistencia por Maestro</h1>
</header>
<div class="container">
  <div class="filters">
    <div class="filter-group">
      <label>Maestro/a</label>
      <select id="sel-maestro"></select>
    </div>
    <div class="filter-group">
      <label>Mes</label>
      <select id="sel-mes"></select>
    </div>
    <button class="btn btn-primary" onclick="renderTable()">Ver asistencia</button>
    <button class="btn btn-secondary" onclick="loadData()">↺ Actualizar</button>
  </div>
  <div id="output"></div>
</div>
<script>
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSnpSR2ceYWpR-79SR5hKZc-6iE1Cutq7fJfsywXmSaiuuvg48zbJVTVTYNgMbSVCTIwSv5RVypw95K/pub?gid=816331834&single=true&output=csv';
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
let allData = [];

function parseCSV(text) {
  // Quitar BOM si viene del endpoint gviz
  text = text.replace(/^﻿/, '');
  const lines = text.trim().split('\n');
  const headers = splitLine(lines[0]);
  return lines.slice(1).map(line => {
    const vals = splitLine(line);
    return Object.fromEntries(headers.map((h, i) => [h.trim(), (vals[i] || '').trim()]));
  }).filter(r => r['Fecha'] || r['fecha'] || r['FECHA']);
}

function splitLine(line) {
  const result = [];
  let cur = '', inQ = false;
  for (const ch of line) {
    if (ch === '"') { inQ = !inQ; }
    else if (ch === ',' && !inQ) { result.push(cur); cur = ''; }
    else { cur += ch; }
  }
  result.push(cur);
  return result.map(v => v.replace(/^"|"$/g, '').trim());
}

// Normaliza nombres de columnas (case insensitive)
function normalizeRow(row) {
  const map = {};
  for (const [k, v] of Object.entries(row)) {
    map[k.toLowerCase().trim()] = v;
  }
  return {
    Fecha:    map['fecha'] || '',
    Maestro:  map['maestro/a'] || map['maestro'] || map['maestra'] || '',
    Nombre:   map['nombre'] || '',
    Estado:   map['estado'] || '',
    Celular:  map['celular'] || '',
    ID:       map['id'] || '',
  };
}

async function loadData() {
  document.getElementById('output').innerHTML = '<div class="loading">Cargando datos...</div>';
  try {
    const res = await fetch(CSV_URL + '&_t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error(`Error HTTP ${res.status}`);
    const text = await res.text();
    if (text.includes('<html') || text.includes('<!DOCTYPE')) throw new Error('La planilla no está publicada como CSV.');
    allData = parseCSV(text).map(normalizeRow).filter(r => r.Fecha && r.Maestro && r.Nombre && r.Estado);
    if (allData.length === 0) throw new Error('No se encontraron datos en la planilla.');
    populateFilters();
    renderTable();
  } catch (e) {
    document.getElementById('output').innerHTML = `<div class="error"><strong>Error al cargar:</strong> ${e.message}</div>`;
  }
}

function parseDate(str) {
  if (!str) return null;
  const d = new Date(str + 'T12:00:00');
  return isNaN(d) ? null : d;
}

function populateFilters() {
  const maestros = [...new Set(allData.map(r => r.Maestro))].filter(Boolean).sort();
  const meses = [...new Set(allData.map(r => {
    const d = parseDate(r.Fecha);
    return d ? `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}` : null;
  }).filter(Boolean))].sort().reverse();

  document.getElementById('sel-maestro').innerHTML = maestros.map(m => `<option value="${m}">${m}</option>`).join('');
  document.getElementById('sel-mes').innerHTML = meses.map(m => {
    const [y, mo] = m.split('-');
    return `<option value="${m}">${MESES[parseInt(mo)-1]} ${y}</option>`;
  }).join('');
}

function renderTable() {
  const maestro = document.getElementById('sel-maestro').value;
  const mes     = document.getElementById('sel-mes').value;
  if (!maestro || !mes) return;

  const [year, month] = mes.split('-').map(Number);
  const filtered = allData.filter(r => {
    const d = parseDate(r.Fecha);
    return r.Maestro === maestro && d && d.getFullYear() === year && d.getMonth()+1 === month;
  });

  if (filtered.length === 0) {
    document.getElementById('output').innerHTML = '<div class="empty">Sin registros para este filtro.</div>';
    return;
  }

  const dates    = [...new Set(filtered.map(r => r.Fecha))].sort();
  const students = [...new Set(filtered.map(r => r.Nombre))].sort();

  // map[alumno][fecha] = estado (Presente gana sobre Ausente si hay duplicado)
  const map = {};
  for (const r of filtered) {
    if (!map[r.Nombre]) map[r.Nombre] = {};
    if (!map[r.Nombre][r.Fecha] || r.Estado === 'Presente') map[r.Nombre][r.Fecha] = r.Estado;
  }

  let totalP = 0, totalA = 0;
  const dateP = {}, dateA = {};
  const stStats = {};

  for (const st of students) {
    let sp = 0, sa = 0;
    for (const d of dates) {
      const e = map[st]?.[d];
      if (e === 'Presente') { sp++; dateP[d] = (dateP[d]||0)+1; }
      else if (e === 'Ausente') { sa++; dateA[d] = (dateA[d]||0)+1; }
    }
    stStats[st] = { p: sp, a: sa };
    totalP += sp; totalA += sa;
  }

  const total      = totalP + totalA;
  const pctGlobal  = total ? Math.round(totalP/total*100) : 0;
  const mesNombre  = `${MESES[month-1]} ${year}`;

  const dias = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  function fmtDate(s) {
    const d = parseDate(s);
    return d ? `${dias[d.getDay()]}<br>${d.getDate()}/${d.getMonth()+1}` : s;
  }

  let html = `
  <div class="stats">
    <div class="stat blue"><div class="val">${students.length}</div><div class="lbl">Alumnos</div></div>
    <div class="stat"><div class="val">${dates.length}</div><div class="lbl">Clases</div></div>
    <div class="stat green"><div class="val">${totalP}</div><div class="lbl">Presentes</div></div>
    <div class="stat red"><div class="val">${totalA}</div><div class="lbl">Ausentes</div></div>
    <div class="stat ${pctGlobal>=75?'green':'orange'}"><div class="val">${pctGlobal}%</div><div class="lbl">Asistencia</div></div>
  </div>
  <div class="table-wrap"><table>
    <thead><tr>
      <th>${maestro} — ${mesNombre}</th>
      ${dates.map(d => `<th>${fmtDate(d)}</th>`).join('')}
      <th>Pres.</th><th>Aus.</th><th>%</th>
    </tr></thead>
    <tbody>`;

  for (const st of students) {
    const { p, a } = stStats[st];
    const pct = (p+a) ? Math.round(p/(p+a)*100) : 0;
    const cells = dates.map(d => {
      const e = map[st]?.[d];
      return e === 'Presente' ? '<td class="p">P</td>'
           : e === 'Ausente'  ? '<td class="a">A</td>'
           : '<td class="dash">—</td>';
    }).join('');
    html += `<tr><td>${st}</td>${cells}<td class="p">${p}</td><td class="a">${a}</td><td class="${pct>=75?'p':'a'}">${pct}%</td></tr>`;
  }

  const totalCells = dates.map(d =>
    `<td><span class="p">${dateP[d]||0}</span>/<span class="a">${dateA[d]||0}</span></td>`
  ).join('');
  html += `<tr class="total-row"><td>TOTAL</td>${totalCells}<td class="p">${totalP}</td><td class="a">${totalA}</td><td>${pctGlobal}%</td></tr>`;
  html += '</tbody></table></div>';

  document.getElementById('output').innerHTML = html;
}

loadData();
</script>
</body>
</html>
